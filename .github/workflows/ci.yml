name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # This repo is PUBLIC. The scan runs first so a leak fails the build
      # before anything else spends time.
      - name: scan for sensitive content
        run: node scripts/scan-secrets.mjs

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test
